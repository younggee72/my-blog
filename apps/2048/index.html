<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>2048</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header class="header">
    <h1 class="title">2048</h1>
    <div class="scores">
      <div class="score-box">
        <span class="score-label">SCORE</span>
        <span class="score-value" id="score">0</span>
      </div>
      <div class="score-box">
        <span class="score-label">BEST</span>
        <span class="score-value" id="best">0</span>
      </div>
    </div>
  </header>

  <div class="controls">
    <p class="intro">방향키 또는 스와이프로 타일을 움직여 2048을 만드세요.</p>
    <div class="buttons">
      <button type="button" id="new-game-btn" class="btn">New Game</button>
      <button type="button" id="theme-toggle-btn" class="btn btn-icon" aria-label="다크모드 전환">🌙</button>
    </div>
  </div>

  <div class="board-container">
    <div class="board" id="board" aria-label="2048 게임 보드">
      <!-- 배경 셀 4x4 -->
      <div class="grid-cells" id="grid-cells"></div>
      <!-- 타일이 렌더링되는 레이어 -->
      <div class="tile-layer" id="tile-layer"></div>

      <div class="overlay" id="overlay" hidden>
        <p class="overlay-message" id="overlay-message"></p>
        <div class="overlay-buttons">
          <button type="button" id="overlay-continue-btn" class="btn" hidden>계속하기</button>
          <button type="button" id="overlay-restart-btn" class="btn">다시 시작</button>
        </div>
      </div>
    </div>
  </div>

  <p class="footer-note">← ↑ → ↓ 방향키 또는 손가락 스와이프로 이동</p>
</div>

<script src="game.js"></script>
</body>
</html>
